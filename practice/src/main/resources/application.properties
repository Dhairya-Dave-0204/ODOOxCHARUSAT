spring.application.name=practice


# Server configuration
server.port=8080

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration
logging.level.root=INFO
logging.level.com.medical.report=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JSON configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# IPFS configuration
ipfs.node.host=localhost
ipfs.node.port=5001

# Blockchain configuration
blockchain.node.url=http://localhost:8545
blockchain.wallet.privateKey=YOUR_PRIVATE_KEY_HERE
blockchain.contract.address=YOUR_CONTRACT_ADDRESS_HERE
blockchain.gas.price=20
blockchain.gas.limit=4500000